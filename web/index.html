<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: required for env(safe-area-inset-*) to be
         non-zero on notched iPhones (LIF-279). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lific</title>
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="x-dns-prefetch-control" content="off" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com/css2; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com/s/; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- PWA: installable / add-to-homescreen on Android + iOS. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Lific" />
    <meta name="theme-color" content="#fafcfb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c221f" media="(prefers-color-scheme: dark)" />
    <!-- Accepted external-resource exception: fixed Google Fonts request.
         Never add document text or project data to this URL. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&amp;display=swap"
      rel="stylesheet"
      referrerpolicy="no-referrer"
    />
    <!-- Prevent flash of wrong appearance: apply theme/accent/density/
         font-scale/motion before anything renders. Mirrors the logic in
         src/lib/theme.ts — keep the two in sync (LIF-238). -->
    <script src="/appearance.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
